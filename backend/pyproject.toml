[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stupid-code"
version = "0.1.0"
description = "Deterministic codebase comprehension and forensic learning engine."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.21",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "networkx>=3.3",
    "httpx>=0.27",
    "openai>=1.40",
    "google-genai>=1.0",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "domain", "engines", "mcp_server"]
# Editable installs put the repository root on sys.path so `backend.*` imports work.
dev-mode-dirs = [".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
